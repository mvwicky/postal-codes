# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "local"
[[repos.hooks]]
id = "biome-check"
name = "biome check"
entry = "bunx @biomejs/biome check --files-ignore-unknown=true --no-errors-on-unmatched"
language = "system"
types = ["text"]
[[repos.hooks]]
id = "bun-check"
name = "bun check"
entry = "bun check"
language = "system"
types = ["text"]
pass_filenames = false
